<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Secure Weather Gateway</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div>
            <p class="eyebrow">NETWORK SECURITY MONITOR</p>
            <h1>Secure Weather Gateway</h1>
            <p class="subtitle">
                HMAC-SHA256 protected UDP sensor monitoring
            </p>
        </div>

        <div class="status">
            <span class="status-dot"></span>
            <span id="system-status">Online</span>
        </div>
    </header>

    <main>

        <section class="stats-grid">

            <div class="stat-card">
                <p class="stat-label">Active Sensors</p>
                <p class="stat-value" id="sensor-count">0</p>
            </div>

            <div class="stat-card">
                <p class="stat-label">Latest Sequence</p>
                <p class="stat-value" id="latest-sequence">-</p>
            </div>

            <div class="stat-card">
                <p class="stat-label">Security</p>
                <p class="stat-value security-value">HMAC</p>
            </div>

        </section>


        <section class="panel">

            <div class="panel-header">
                <div>
                    <p class="eyebrow">LIVE DATA</p>
                    <h2>Sensors</h2>
                </div>

                <span class="live-indicator">
                    ● Live
                </span>
            </div>

            <div id="sensor-container" class="sensor-grid">

                <p class="empty-message">
                    Waiting for sensor data...
                </p>

            </div>

        </section>

    </main>

    <script src="app.js"></script>

</body>
</html>
